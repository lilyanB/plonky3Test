[package]
name = "zkp-age-proof"
version = "0.1.0"
edition = "2024"

[dependencies]
p3-air = "0.5"
p3-challenger = "0.5"
p3-commit = "0.5"
p3-dft = "0.5"
p3-field = "0.5"
p3-fri = "0.5"
p3-koala-bear = "0.5"
p3-matrix = "0.5"
p3-merkle-tree = "0.5"
p3-symmetric = "0.5"
p3-uni-stark = "0.5"
rand = { version = "0.10", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
tracing = "0.1"
tracing-forest = "0.3"
tracing-subscriber = { version = "0.3", features = ["alloc", "env-filter"] }
